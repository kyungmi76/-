# ============================================================
# 대학 입학설명회 자동신청 봇 설정
# ============================================================

# ── 공통 신청자 정보 ──────────────────────────────────────
applicant:
  name: "김경미"
  phone: "010-4711-8574"
  email: "kmikim@gsgcprp.com"
  school: "선덕고등학교"
  grade: "3"
  region: "서울"

# ── 봇 동작 설정 ──────────────────────────────────────────
bot:
  headless: false          # false = 브라우저 화면 표시(권장)
  timeout: 20000           # 페이지 로딩 최대 대기 (ms)
  retry_interval: 5        # 재시도 간격 (초)
  max_retries: 36          # 최대 재시도 횟수 (36회 × 5초 = 3분)
  early_start_minutes: 3   # 신청 시작 N분 전에 브라우저 열고 대기

# ── 이메일 알림 설정 ──────────────────────────────────────
# 신청 10분 전에 휴대폰으로 알림 이메일 발송
# Gmail 사용 시: 구글 계정 → 보안 → 앱 비밀번호 생성 후 아래 입력
email_alert:
  enabled: true
  notify_minutes_before: 10        # 신청 시작 10분 전에 발송
  to: "kmikim@gsgcprp.com"         # 받는 주소 (폰에서 확인할 주소)
  from_address: "YOUR_GMAIL@gmail.com"   # 보내는 Gmail 주소
  app_password: "YOUR_APP_PASSWORD"      # Gmail 앱 비밀번호 (16자리)

  # 연세대는 직접 신청 — 알림만 발송
  manual_alerts:
    - datetime: "2026-03-30 10:00:00"
      message: "🔔 지금 바로 연세대 입학설명회 신청하세요!\n👉 https://admission.yonsei.ac.kr/seoul/admission/html/main/main.asp\n신청 설명회: 2026년 4월 18일(토) 오전 10:00"

# ── 대학별 설정 ───────────────────────────────────────────
universities:

  # 연세대학교 -----------------------------------------------
  yonsei:
    name: "연세대학교"
    enabled: false   # 직접 신청 예정 — 이메일 알림만 발송
    # ★ 봇이 접속해서 신청 버튼을 클릭하는 시각 (선착순 시작)
    apply_open_datetime: "2026-03-30 10:00:00"
    # ★ 폼에서 선택할 설명회 날짜 (원하는 회차)
    session_date: "2026-04-18"   # 4월 18일(토) 오전 10:00 설명회
    session_date_text: "4월 18일, 2026년 4월 18일, 04/18, 4/18"  # 폼에 나타날 수 있는 텍스트

    login:
      id: "YONSEI_ID"
      password: "YONSEI_PW"
      url: "https://admission.yonsei.ac.kr/seoul/admission/html/member/login.asp"
      id_selector: "input[name='id'], input[name='userId'], input[type='text']"
      pw_selector: "input[name='pw'], input[name='userPw'], input[type='password']"
      submit_selector: "button[type='submit'], input[type='submit'], a:has-text('로그인')"
      success_check: "a:has-text('로그아웃'), a:has-text('마이페이지')"

    seminar:
      url: "https://admission.yonsei.ac.kr/seoul/admission/html/info/seminar.asp"
      apply_btn_selector: "a:has-text('신청'), button:has-text('신청'), a:has-text('접수')"
      form_fields:
        name: "name,userName,applicantName"
        phone: "phone,tel,mobile,hp,cellphone"
        email: "email,mail,userEmail"
        school: "school,highSchool,schoolName"
        grade: "grade,schoolGrade"

  # 고려대학교 -----------------------------------------------
  korea:
    name: "고려대학교"
    enabled: true
    apply_open_datetime: "2026-04-02 10:00:00"
    session_date: "2026-04-25"   # 4월 25일(토) 오전 10:00 설명회
    session_date_text: "4월 25일, 2026년 4월 25일, 04/25, 4/25"

    login:
      id: "KOREA_ID"
      password: "KOREA_PW"
      url: "https://oku.korea.ac.kr/oku/login.do"
      id_selector: "input[name='id'], input[name='userId'], input[id='id']"
      pw_selector: "input[name='pw'], input[name='password'], input[type='password']"
      submit_selector: "button[type='submit'], input[type='submit'], a:has-text('로그인')"
      success_check: "a:has-text('로그아웃'), a:has-text('마이페이지'), span:has-text('님')"

    seminar:
      url: "https://oku.korea.ac.kr/oku/index.do"
      apply_btn_selector: "a:has-text('신청'), button:has-text('신청'), a:has-text('접수'), a:has-text('참가신청')"
      form_fields:
        name: "name,userName,applicantName"
        phone: "phone,tel,mobile,hp"
        email: "email,mail,userEmail"
        school: "school,highSchool,schoolName"
        grade: "grade,schoolGrade"

  # 경희대학교 -----------------------------------------------
  kyunghee:
    name: "경희대학교"
    enabled: true
    apply_open_datetime: "2026-04-20 16:00:00"
    session_date: "2026-05-30"   # 5월 30일(토) 설명회
    session_date_text: "5월 30일, 2026년 5월 30일, 05/30, 5/30"

    login:
      id: "KHU_ID"
      password: "KHU_PW"
      url: "https://iphak.khu.ac.kr/login.do"
      id_selector: "input[name='id'], input[name='userId'], input[type='text']"
      pw_selector: "input[name='pw'], input[name='password'], input[type='password']"
      submit_selector: "button[type='submit'], input[type='submit'], a:has-text('로그인')"
      success_check: "a:has-text('로그아웃'), a:has-text('마이페이지')"

    seminar:
      url: "https://iphak.khu.ac.kr/detail.do?menuurl=KnGkqceB267fZdhM2T482w%3D%3D&board_seq=16744&pageNo=1&categoryid=42&userpwd="
      apply_btn_selector: "a:has-text('신청'), button:has-text('신청'), input[type='submit'], a:has-text('접수'), a:has-text('참가신청')"
      form_fields:
        name: "name,userName,applicantName"
        phone: "phone,tel,mobile,hp"
        email: "email,mail"
        school: "school,highSchool"
        grade: "grade"
