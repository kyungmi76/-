# ========================================
# 연세대학교 입학설명회 자동신청 봇 설정
# ========================================

# 로그인 정보 (연세대 입학처 회원)
login:
  id: "YOUR_ID"
  password: "YOUR_PASSWORD"

# 신청자 정보 (폼에 자동으로 입력될 내용)
applicant:
  name: "홍길동"
  phone: "010-0000-0000"
  email: "example@email.com"
  school: "OO고등학교"        # 재학/졸업 고교명
  grade: "3"                  # 학년 (1, 2, 3 또는 졸업)
  region: "서울"              # 거주 지역

# 봇 동작 설정
bot:
  check_interval: 60          # 설명회 확인 주기 (초). 기본 60초
  headless: false             # false = 브라우저 화면 표시 (권장), true = 백그라운드 실행
  timeout: 15000              # 페이지 로딩 최대 대기 시간 (ms)

# 대상 설명회 필터 (빈 리스트면 모든 설명회 신청)
# 특정 키워드가 제목에 포함된 설명회만 신청
target_keywords:
  - ""                        # 예: "수시", "정시", "학생부종합" 등
